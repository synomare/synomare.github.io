backend:
  name: github
  repo: synomare/synomare.github.io
  branch: main
  base_url: https://synomare-notes-oauth.decap-oauth.workers.dev
  auth_endpoint: /auth
  commit_messages:
    create: "content: create {{collection}} {{slug}}"
    update: "content: update {{collection}} {{slug}}"
    delete: "content: delete {{collection}} {{slug}}"
    uploadMedia: "assets: upload {{path}}"
    deleteMedia: "assets: delete {{path}}"

site_url: https://synomare.github.io
display_url: https://synomare.github.io
publish_mode: simple

media_folder: assets/images/notes
public_folder: /assets/images/notes

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: notes/content
    create: true
    delete: true
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - label: URL Slug
        name: slug
        widget: string
        hint: 英小文字・数字・ハイフンのみ。公開後はURL維持のため変更しないでください。
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - 英小文字・数字・ハイフンのみで入力してください。
      - label: タイトル
        name: title
        widget: string
        required: false
        hint: テキスト投稿では必須です。写真投稿は未入力でも公開できます。
      - label: 投稿タイプ
        name: post_type
        widget: select
        options:
          - { label: テキスト / 写真を含む記事, value: text }
          - { label: 写真のみ, value: photo }
        default: text
        hint: 写真のみを選ぶ場合は、下の「写真投稿の画像」を1枚設定してください。
      - label: 写真投稿の画像
        name: photo
        widget: image
        required: false
        media_folder: /assets/images/notes
        public_folder: /assets/images/notes
        hint: 「写真のみ」の投稿で使います。テキスト本文へ画像を入れる場合は本文の画像ボタンを使ってください。
      - label: 公開日
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 概要
        name: summary
        widget: text
        required: false
        hint: Notes一覧と検索結果に表示する1〜2文です。
      - label: タグ
        name: tags
        widget: list
        required: false
        min: 0
        max: 20
        default: [未分類]
        allow_add: true
        collapsed: false
        field:
          label: タグ
          name: tag
          widget: string
          required: true
      - label: 別名
        name: aliases
        widget: list
        required: false
        default: []
        hint: 内部リンクで使いたい別名がある場合だけ追加します。
      - label: カードサイズ
        name: card_size
        widget: select
        options:
          - { label: AUTO / 内容に合わせる, value: auto }
          - { label: S / 小, value: s }
          - { label: M / 中, value: m }
          - { label: L / 大, value: l }
        default: auto
        hint: AUTOは写真投稿=L、画像入りテキスト=M、テキストのみ=Sになります。手動指定はAUTOより優先されます。
      - label: カード用抜粋
        name: card_excerpt
        widget: text
        required: false
        hint: 未入力なら概要、概要も未入力なら本文冒頭を使用します。
      - label: 本文
        name: body
        widget: markdown
        required: false
        hint: テキスト投稿では必須です。写真投稿では空で構いません。JPEG・PNG・WebP・GIF・AVIF・BMP・SVG・HEICに対応します。
      - label: 公開設定
        name: draft
        widget: boolean
        default: false
        hint: オンの間は保存されますが、公開ページには表示されません。

  - name: works
    label: Works
    label_singular: Work
    folder: works/content
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{year}} — {{title}}"
    sortable_fields: [year, title]
    fields:
      - label: URL Slug
        name: slug
        widget: string
        hint: 英小文字・数字・ハイフンのみ。管理用ファイル名になります。
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - 英小文字・数字・ハイフンのみで入力してください。
      - label: 作品名
        name: title
        widget: string
      - label: 制作年
        name: year
        widget: string
        pattern:
          - "^[0-9]{4}(?:[–-][0-9]{2,4})?$"
          - 2025 または 2024-2025 の形式で入力してください。
      - label: 説明
        name: summary
        widget: text
      - label: 種別
        name: type
        widget: string
        hint: 例：演劇 / Theatre、グラフィック / Graphic
      - label: リンク先
        name: url
        widget: string
        required: false
        hint: サイト内ページは /yugun/ のように、外部ページは https:// から入力します。未入力ならリンクなしで表示します。
      - label: 一覧画像
        name: image
        widget: image
        required: false
        media_folder: /assets/images/works
        public_folder: /assets/images/works
        media_library:
          config:
            max_file_size: 10485760
        hint: 未入力なら現在と同じテキスト行として表示します。
      - label: 表示優先度
        name: priority
        widget: number
        required: false
        default: 0
        value_type: int
        hint: 数字が大きい作品ほど上に表示します。同じ場合は制作年の新しい順です。
      - label: 公開設定
        name: draft
        widget: boolean
        default: false
        hint: オンの間はWorks一覧に表示されません。
