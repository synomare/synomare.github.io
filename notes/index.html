    .tools{position:relative;display:grid;grid-template-columns:minmax(190px,1fr) auto auto;gap:0;align-items:center;margin-bottom:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font:400 .58rem/1.4 var(--mono);letter-spacing:.06em}.tools input,.tools select,.tools button{min-height:38px;border:0;border-radius:0;background:transparent;color:var(--ink);font:inherit;padding:6px 10px}.tools input{min-width:0;border-right:1px solid var(--line)}.tools button{cursor:pointer}.tools :focus-visible{outline:2px solid var(--red);outline-offset:-2px}.count{padding:0 10px;color:var(--red);white-space:nowrap}.filter-more{position:relative;border-right:1px solid var(--line)}.filter-more summary{min-height:38px;display:flex;align-items:center;padding:0 12px;cursor:pointer;list-style:none;white-space:nowrap}.filter-more summary::-webkit-details-marker{display:none}.filter-more summary::after{content:"＋";margin-left:.7rem;color:var(--red)}.filter-more[open] summary::after{content:"−"}.filter-state{margin-left:.7rem;color:var(--red);font-size:.9em;letter-spacing:.04em}.filter-options{position:absolute;z-index:20;right:-1px;top:calc(100% + 1px);min-width:330px;display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ink);border-top:0;background:rgba(244,243,239,.98);box-shadow:5px 5px 0 rgba(23,20,15,.12)}.filter-options select{border-bottom:1px solid var(--line)}.filter-options select:first-of-type{border-right:1px solid var(--line)}.view-control{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:7px 8px;white-space:nowrap}.view-control span{margin-right:auto;color:var(--dim)}.view-control button{border:1px solid transparent;padding:4px 10px;min-height:28px}.view-control button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}.filter-options .clear-filters{grid-column:1/-1;border-top:1px solid var(--line);color:var(--red);text-align:left}
    .post-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:var(--row);column-gap:var(--column-gap);row-gap:0;align-items:start;margin-top:clamp(24px,3.2vw,46px)}.post-card{min-width:0;overflow:visible;padding-bottom:var(--stack-gap);background:transparent}.post-card>a{position:relative;isolation:isolate;display:flex;flex-direction:column;transition:transform .2s cubic-bezier(.2,.7,.2,1)}.post-card>a::before{content:"";position:absolute;z-index:-1;inset:-10px -11px -12px;background:color-mix(in srgb,var(--ink) 4%,var(--paper));border-top:1px solid transparent;opacity:0;transform:scale(.985);transition:opacity .18s ease,transform .2s cubic-bezier(.2,.7,.2,1),border-color .18s ease}.post-card:hover>a,.post-card:focus-within>a{transform:translateY(-2px)}.post-card:hover>a::before,.post-card:focus-within>a::before{opacity:1;transform:scale(1);border-color:color-mix(in srgb,var(--red) 70%,transparent)}.post-card>a:focus-visible{outline:1px solid var(--red);outline-offset:6px}.card-media{position:relative;aspect-ratio:var(--ratio,3/2);overflow:hidden;background:var(--paper)}.card-media::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .18s ease}.post-card:hover .card-media::after,.post-card:focus-within .card-media::after{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 46%,transparent)}.card-image{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.84) contrast(1.03);transition:filter .18s ease,transform .35s cubic-bezier(.2,.7,.2,1)}.post-card:hover .card-image,.post-card:focus-within .card-image{filter:saturate(1) contrast(1.03);transform:scale(1.012)}.card-image-fallback{position:absolute;inset:0;display:none;place-items:center;padding:1rem;background:repeating-linear-gradient(135deg,var(--card),var(--card) 10px,var(--paper) 10px,var(--paper) 20px);color:var(--dim);text-align:center;font:400 .5rem/1.7 var(--mono);letter-spacing:.08em}.card-media.is-error .card-image{display:none}.card-media.is-error .card-image-fallback{display:grid}.card-body{display:flex;flex-direction:column;padding:clamp(10px,1vw,15px) 2px 0}.card-meta{display:flex;justify-content:space-between;gap:.75rem;margin-bottom:clamp(.6rem,1vw,.9rem);font:400 .46rem/1.4 var(--mono);letter-spacing:.12em;color:var(--red);transition:letter-spacing .18s ease}.post-card:hover .card-meta,.post-card:focus-within .card-meta{letter-spacing:.16em}.card-title{margin:0;font-weight:500;font-size:clamp(.98rem,1.35vw,1.38rem);line-height:1.32;letter-spacing:-.025em;overflow-wrap:anywhere;transition:color .18s ease}.post-card:hover .card-title,.post-card:focus-within .card-title{color:var(--red)}.post-card[data-size="l"] .card-title{font-size:clamp(1.25rem,1.8vw,1.9rem);line-height:1.22}.card-excerpt{display:-webkit-box;-webkit-line-clamp:var(--clamp,3);-webkit-box-orient:vertical;overflow:hidden;margin:.6rem 0 0;color:#514b41;font-size:.68rem;line-height:1.72}.post-card[data-size="s"] .card-excerpt{-webkit-line-clamp:2}.card-tags{margin-top:.8rem;color:var(--dim);text-align:left;font:400 .44rem/1.5 var(--mono);letter-spacing:.06em}.post-card[data-has-image="false"] .card-body{max-width:31ch;padding-top:clamp(3px,.7vw,10px)}.post-card[data-has-image="false"] .card-meta{padding-bottom:.55rem;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}.post-card[data-has-image="true"][data-size="l"] .card-body{max-width:min(88%,54ch)}.post-card[data-type="photo"] .card-media{aspect-ratio:var(--ratio,4/3);max-height:min(68vh,560px)}.post-card[data-type="photo"] .card-image{height:100%;min-height:0;object-fit:contain}.post-card[data-type="photo"] .card-body{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;padding:.55rem 0 0}.post-card[data-type="photo"] .card-meta{display:contents}.post-card[data-type="photo"] .card-meta span{grid-column:1}.post-card[data-type="photo"] .card-meta time{grid-column:2;grid-row:1}.post-card[data-type="photo"] .card-title{grid-column:1/-1;font-size:clamp(.82rem,1.2vw,1.05rem);line-height:1.45}.post-card[data-type="photo"] .card-excerpt,.post-card[data-type="photo"] .card-tags{display:none}
    .empty{grid-column:1/-1;min-height:260px;display:grid;place-items:center;border:1px solid var(--line);font-size:.84rem;color:var(--dim);text-align:center}.empty strong{display:block;color:var(--ink);font:italic 400 2.2rem var(--latin);margin-bottom:.5rem}
    footer{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 1rem;border-top:1px solid var(--ink);font:400 .54rem/1.5 var(--mono);letter-spacing:.17em;text-transform:uppercase}.footer-red{color:var(--red)}
    body[data-view="s"] .card-excerpt{--clamp:2}body[data-view="l"] .card-excerpt{--clamp:5}
    @media(min-width:1001px){.display{font-size:clamp(4.4rem,9vw,8rem)}}
    @media(max-width:1000px){.hero{align-items:flex-start;flex-direction:column}.hero-copy{margin-left:auto}}
    @media(max-width:700px){.topbar{font-size:.55rem}.topbar nav{margin-left:0;width:100%;overflow:auto;flex-wrap:nowrap;padding-bottom:2px}.topbar nav a{min-height:44px;display:inline-flex;align-items:center;padding-inline:.35rem}.tools input,.tools select,.tools button,.filter-more summary{min-height:44px}.filter-more[open]{grid-column:1/-1;border-right:0}.filter-more[open] .filter-options{position:static;width:100%;max-width:none;border:0;border-top:1px solid var(--line);box-shadow:none}.filter-more[open]~.count{grid-column:1/-1;grid-row:auto;min-height:44px;display:flex;align-items:center;justify-content:flex-end;border-top:1px solid var(--line)}.view-control button{min-width:44px;min-height:44px}main{padding-left:12px;padding-right:12px}.hero{gap:1.25rem;margin-bottom:1.4rem}.display{font-size:clamp(4rem,20vw,5.5rem)}.hero-copy{max-width:34ch;font-size:.72rem}.tools{grid-template-columns:minmax(0,1fr) auto}.tools input{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}.filter-more{grid-column:1;border-right:1px solid var(--line)}.count{grid-column:2;grid-row:2}.filter-options{left:-1px;right:auto;min-width:0;width:min(88vw,360px);max-width:calc(100vw - 24px)}.post-grid{display:block;margin-top:24px}.post-card{height:auto!important;margin-top:clamp(24px,7vw,34px);padding-bottom:0}.post-card:first-child{margin-top:0}.card-media{aspect-ratio:2/1}.post-card[data-size="s"] .card-media{aspect-ratio:2.25/1}.post-card[data-size="l"] .card-media{aspect-ratio:16/10}.post-card[data-type="photo"] .card-media{aspect-ratio:var(--ratio,4/3);max-height:min(72svh,560px)}.card-body{padding:10px 1px 0}.card-meta{margin-bottom:.65rem}.post-card[data-has-image="false"] .card-body{max-width:35ch}.post-card[data-size="s"] .card-excerpt{-webkit-line-clamp:2}.post-card[data-size="m"] .card-excerpt{-webkit-line-clamp:3}.post-card[data-size="l"] .card-excerpt{-webkit-line-clamp:4}.post-card[data-size="l"] .card-title{font-size:clamp(1.4rem,7vw,2.15rem)}.post-card[data-type="photo"] .card-title{font-size:1rem}footer{flex-direction:column}}
    :root{--dim:#756e62}.card-meta{font-size:.58rem}.card-title{font-size:clamp(1.06rem,1.45vw,1.52rem)}.card-excerpt{font-size:.78rem}.card-tags{font-size:.55rem}

<body data-view="m">
  <a class="sr-only" href="#main">Skip to Content</a>
  <header class="topbar"><a href="../">SYNOMARE</a><span class="date">JST <span id="today">----.--.--</span></span><nav aria-label="site"><a href="../">INDEX</a><a href="../works.html">WORKS</a><a href="../notes/" aria-current="page">NOTES</a><a href="../links.html">LINKS</a><a href="../profile.html">PROFILE</a><a href="mailto:synomare@gmail.com">CONTACT</a></nav></header>
  <main id="main">
    <section class="hero"><h1 class="display">Notes</h1><p class="hero-copy">書いたもの、考えたこと、途中にある断片。それぞれの記事から、別の記事へ辿れます。</p></section>
    <form class="tools" id="filters" role="search" aria-label="Notesを検索">
      <label class="sr-only" for="search">Notesを検索</label><input id="search" type="search" placeholder="SEARCH TITLE, TEXT OR TAG" autocomplete="off">
      <details class="filter-more">
        <summary><span>FILTER / VIEW</span><span class="filter-state" id="filterState" aria-live="polite">VIEW M</span></summary>
        <div class="filter-options">
          <label class="sr-only" for="tag">タグ</label><select id="tag"><option value="">ALL TAGS</option></select>
          <label class="sr-only" for="yearFilter">年</label><select id="yearFilter"><option value="">ALL YEARS</option></select>
          <div class="view-control" aria-label="表示密度"><span>VIEW SIZE</span><button type="button" data-view="s">S</button><button type="button" data-view="m">M</button><button type="button" data-view="l">L</button></div>
          <button class="clear-filters" id="clearFilters" type="button" hidden>CLEAR FILTERS</button>
        </div>
      </details>
      <output class="count" id="count" aria-live="polite"></output>
    </form>
    <section class="post-grid" id="postGrid" aria-label="投稿一覧"></section>
  </main>
  <footer><span>SYNOMARE / NOTES — 雑記</span><span>&copy; <span id="year"></span> SYNOMARE <span class="footer-red">●</span></span></footer>
  <script src="posts.js"></script>
  <script>
  (()=>{
    const $=id=>document.getElementById(id);const posts=(window.__SYNOMARE_POSTS__||[]).slice();const grid=$('postGrid'),filters=$('filters'),search=$('search'),tag=$('tag'),year=$('yearFilter'),count=$('count'),filterState=$('filterState'),clearFilters=$('clearFilters');
    const params=new URLSearchParams(location.search);const saved=localStorage.getItem('synomare-notes-view');const initial=/^[sml]$/.test(params.get('view'))?params.get('view'):(/^[sml]$/.test(saved)?saved:'m');
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setView(value,render=true){document.body.dataset.view=value;document.querySelectorAll('.view-control [data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===value)));localStorage.setItem('synomare-notes-view',value);if(render)updateUrl();queueLayout()}
    [...new Set(posts.flatMap(post=>post.tags||[]))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(value=>tag.add(new Option(value,value)));[...new Set(posts.map(post=>post.year).filter(Boolean))].sort().reverse().forEach(value=>year.add(new Option(value,value)));
    search.value=params.get('q')||'';tag.value=params.get('tag')||'';year.value=params.get('year')||'';
    function updateUrl(){const next=new URLSearchParams();if(search.value.trim())next.set('q',search.value.trim());if(tag.value)next.set('tag',tag.value);if(year.value)next.set('year',year.value);if(document.body.dataset.view!=='m')next.set('view',document.body.dataset.view);history.replaceState(null,'',location.pathname+(next.size?'?'+next:''));render()}
    function syncFilterState(){const active=[search.value.trim(),tag.value,year.value].filter(Boolean).length;filterState.textContent=`${active?`${active} ACTIVE · `:''}VIEW ${(document.body.dataset.view||'m').toUpperCase()}`;clearFilters.hidden=!active}
    function render(){const q=search.value.trim().normalize('NFKC').toLocaleLowerCase('ja');const visible=posts.filter(post=>(!q||[post.title,post.summary,post.cardExcerpt,...(post.tags||[])].join(' ').normalize('NFKC').toLocaleLowerCase('ja').includes(q))&&(!tag.value||(post.tags||[]).includes(tag.value))&&(!year.value||post.year===year.value));count.value=`${visible.length} / ${posts.length} ENTRIES`;syncFilterState();
      if(!visible.length){grid.innerHTML=`<div class="empty"><div><strong>${posts.length?'No match':'No notes yet'}</strong>${posts.length?'検索条件を変えてみてください。':'最初の記事が公開されると、ここにカードが現れます。'}</div></div>`;return}
      const eagerImageIndex=visible.findIndex(post=>post.image);grid.innerHTML=visible.map((post,visibleIndex)=>{const type=post.postType==='photo'?'photo':'text';const mode=/^(?:auto|s|m|l)$/.test(post.cardSizeMode)?post.cardSizeMode:'auto';const size=mode==='auto'?(type==='photo'?'l':post.image?'m':'s'):(/^[sml]$/.test(post.cardSize)?post.cardSize:'m');const ratio=type==='photo'?'4/3':post.image?(size==='l'?'16/10':size==='s'?'2.25/1':'2/1'):size==='s'?'1/1':'4/3';const excerpt=type==='photo'?'':(post.cardExcerpt||post.summary);const tags=(post.tags||[]).slice(0,3);const title=post.title||'';const archiveNumber=Number.isInteger(post.archiveNumber)?post.archiveNumber:posts.indexOf(post)+1;const priority=visibleIndex===eagerImageIndex;return `<article class="post-card" data-type="${type}" data-size="${size}" data-size-mode="${esc(mode)}" data-has-image="${post.image?'true':'false'}" style="--ratio:${ratio}"><a href="${esc(post.href||post.slug+'.html')}" aria-label="${esc(title||post.displayTitle||'写真を開く')}">${post.image?`<div class="card-media"><img class="card-image" src="${esc(post.image)}" alt="" loading="${priority?'eager':'lazy'}" fetchpriority="${priority?'high':'auto'}" decoding="async"><span class="card-image-fallback">IMAGE UNAVAILABLE<br>詳細を開いて確認</span></div>`:''}<div class="card-body"><div class="card-meta"><span>${type==='photo'?'P':'N'}.${String(archiveNumber).padStart(3,'0')}</span><time datetime="${esc(post.date)}">${esc(post.date)}</time></div>${title?`<h2 class="card-title">${esc(title)}</h2>`:''}${excerpt?`<p class="card-excerpt">${esc(excerpt)}</p>`:''}${type==='text'&&tags.length?`<div class="card-tags">${tags.map(item=>'#'+esc(item)).join(' ')}</div>`:''}</div></a></article>`}).join('');grid.querySelectorAll('img').forEach(img=>{const card=img.closest('.post-card');const ready=()=>{if(card?.dataset.type==='photo'&&img.naturalWidth&&img.naturalHeight)card.style.setProperty('--ratio',`${img.naturalWidth}/${img.naturalHeight}`);queueLayout()};const fail=()=>{img.closest('.card-media')?.classList.add('is-error');queueLayout()};img.addEventListener('load',ready,{once:true});img.addEventListener('error',fail,{once:true});if(img.complete){if(img.naturalWidth)ready();else fail()}});queueLayout()}
    const spans={s:{s:2,m:3,l:4},m:{s:3,m:4,l:5},l:{s:4,m:5,l:7}},compactSpans={s:{s:3,m:4,l:5},m:{s:4,m:5,l:7},l:{s:5,m:7,l:9}},autoSpans={s:{plain:2,image:3,photo:4},m:{plain:3,image:3,photo:4},l:{plain:4,image:4,photo:6}},compactAutoSpans={s:{plain:3,image:4,photo:5},m:{plain:4,image:4,photo:5},l:{plain:5,image:6,photo:8}};let layoutFrame=0;
    function queueLayout(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(layoutCards)}
    function layoutCards(){const cards=[...grid.querySelectorAll('.post-card')];if(matchMedia('(max-width:700px)').matches){cards.forEach(card=>{card.style.gridColumn='';card.style.gridRow=''});return}const view=document.body.dataset.view||'m';const compact=matchMedia('(max-width:1000px)').matches;const table=compact?compactSpans:spans;const automatic=compact?compactAutoSpans:autoSpans;const row=parseFloat(getComputedStyle(grid).gridAutoRows)||4;cards.forEach(card=>{const variant=card.dataset.type==='photo'?'photo':card.dataset.hasImage==='true'?'image':'plain';const span=card.dataset.sizeMode==='auto'?(automatic[view][variant]||3):(table[view][card.dataset.size]||3);card.dataset.layoutSpan=span;card.style.gridColumn=`span ${span}`;card.style.gridRow='auto'});grid.offsetWidth;const lanes=Array(12).fill(0);let sequenceFloor=0;cards.forEach(card=>{const span=Number(card.dataset.layoutSpan)||3;const rows=Math.max(1,Math.ceil(card.getBoundingClientRect().height/row));let bestStart=0,bestTop=Infinity;for(let start=0;start<=12-span;start++){const top=Math.max(sequenceFloor,...lanes.slice(start,start+span));if(top<bestTop){bestTop=top;bestStart=start}}card.style.gridColumn=`${bestStart+1} / span ${span}`;card.style.gridRow=`${bestTop+1} / span ${rows}`;for(let lane=bestStart;lane<bestStart+span;lane++)lanes[lane]=bestTop+rows;sequenceFloor=bestTop})}
    let timer;filters.addEventListener('submit',event=>event.preventDefault());search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(updateUrl,120)});tag.addEventListener('change',updateUrl);year.addEventListener('change',updateUrl);clearFilters.addEventListener('click',()=>{clearTimeout(timer);search.value='';tag.value='';year.value='';updateUrl();search.focus()});document.querySelectorAll('.view-control [data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));addEventListener('resize',queueLayout,{passive:true});document.fonts?.ready.then(queueLayout);
    const now=new Date();$('today').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(now).replaceAll('/','.');$('year').textContent=now.getFullYear();setView(initial,false);render();
  })();
  </script>
